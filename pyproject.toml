[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "failurelens"
version = "0.1.0"
description = "Training-dynamics diagnostics for finding mislabeled, hard, and unstable classification samples."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ZXR"}]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
demo = ["torch>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

